name: Morning edition (API backup)

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: morning-edition
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build today's edition
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/build-digest.mjs
      - name: Publish
        run: |
          git config user.name "Billionaires Digest bot"
          git config user.email "hello@billionairesdigest.com"
          # Commits, then fetch/rebase/push with retries (see scripts/lib/safe-push.mjs).
          node scripts/safe-push.mjs --message "Morning edition $(date -u +%Y-%m-%d)" -- digest.json archive
