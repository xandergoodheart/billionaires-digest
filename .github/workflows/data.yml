name: Morning data

on:
  schedule:
    - cron: '30 9 * * *' # 09:30 UTC, before the 10:00 UTC edition
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: morning-data
  cancel-in-progress: false

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: SEC filings
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: node scripts/fetch-filings.mjs
      - name: Market prices
        if: ${{ !cancelled() }}
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: node scripts/fetch-prices.mjs
      - name: Static pages
        if: ${{ !cancelled() }}
        run: node scripts/build-pages.mjs
      - name: Publish
        if: ${{ !cancelled() }}
        run: |
          git config user.name "Billionaires Digest bot"
          git config user.email "hello@billionairesdigest.com"
          mkdir -p data/filings data/prices
          git add data/filings data/prices people editions sitemap.xml robots.txt
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Morning data $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
